name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        runner: [ ubuntu-24.04, ubuntu-24.04-arm ]
    runs-on: ${{ matrix.runner }}
    container:
      image: fedora:43
    env:
      RUSTC_BOOTSTRAP: "1"
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install check tools
        uses: taiki-e/install-action@v2.90.0
        with:
          tool: hawkeye@6.5.0,cargo-deny@0.19.9,cargo-audit@0.22.2

      - name: Check license headers
        run: |
          hawkeye check --config licenserc.toml
          hawkeye check --config policy/licenserc.toml

      - name: Install policy build tools
        run: dnf install -y gcc rust cargo rust-src llvm-devel clippy rustfmt

      - name: Check dependency policy
        run: cargo deny --locked --workspace --all-features check licenses sources bans

      - name: Check known vulnerabilities
        run: cargo audit

      - name: Install the BPF linker
        run: >-
          cargo install --locked --version '=0.13.0' --root /usr
          --no-default-features --features llvm-21 bpf-linker

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check the loader
        run: cargo clippy --locked --release --all-targets -- -D warnings

      - name: Check the policy
        run: >-
          cargo clippy --locked --release -p policy
          --target bpfel-unknown-none -Z build-std=core -- -D warnings
