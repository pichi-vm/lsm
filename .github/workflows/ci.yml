name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        runner: [ ubuntu-24.04, ubuntu-24.04-arm ]
    runs-on: ${{ matrix.runner }}
    container:
      image: fedora:43
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install check tools
        uses: taiki-e/install-action@v2.90.0
        with:
          tool: hawkeye@6.5.0,cargo-deny@0.19.9

      - name: Check license headers
        run: hawkeye check --config licenserc.toml

      - name: Install Rust build tools
        run: dnf install -y gcc rust cargo clippy rustfmt

      - name: Check dependency policy
        run: cargo deny --locked --all-features check licenses sources bans

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check Rust
        run: cargo clippy --locked --release --all-targets -- -D warnings
